name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar, buildear y subir artifact de Pages (Astro)
        uses: withastro/action@v4
        # Esta acción ya hace: instala deps, corre `astro build` y ejecuta
        # internamente actions/upload-pages-artifact. No agregar otro
        # step de upload-pages-artifact después de este, o vas a duplicar
        # el artifact y obtener un 409 Conflict.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
